docs_url = "https://docs.posit.co/rspm/admin/repositories/"

["OpenVSX mirror is accessible"]
summary = "Verifies Package Manager serves a known VS Code extension from a configured OpenVSX repository"
likely_causes = [
    "No OpenVSX-type repository is configured in Package Manager",
    "The OpenVSX source has not finished its initial sync",
]
suggested_steps = [
    "Check configured repositories: `rspm list repos` on the Package Manager host",
    "Check sync status: `rspm list sources` and wait for the initial sync to complete",
]
docs_url = "https://docs.posit.co/rspm/admin/repositories/"

["At least one repository is configured"]
summary = "Verifies Package Manager has at least one repository configured"
likely_causes = [
    "Package Manager was installed but no repositories were ever created",
    "Repositories exist but were deleted or renamed",
]
suggested_steps = [
    "Create a repository: `rspm create repo --name=<name> --type=<cran|python|bioconductor>`",
    "List existing repositories: `rspm list repos`",
]
docs_url = "https://docs.posit.co/rspm/admin/repositories/"
