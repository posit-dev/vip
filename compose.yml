# Local development environment for VIP Playwright tests.
#
# Spins up Workbench, Connect, and Package Manager with local password auth
# so you can iterate on Playwright selectors and run UI tests without a
# remote deployment.
#
# Usage:
#   just compose-up              # start Workbench only (default service)
#   just compose-up workbench    # start only Workbench (explicit)
#   docker compose --profile full up -d    # start Workbench + Connect + Package Manager
#   just test-local              # start Workbench + run tests
#
# License keys:
#   Set these environment variables (or add them to .env):
#     PWB_LICENSE        - Posit Workbench license key
#     PCT_LICENSE        - Posit Connect license key
#     PPM_LICENSE        - Posit Package Manager license key
#
# Image versions:
#   Image tags default to :latest for convenience. To pin versions for
#   reproducible test environments, create a .env file (see .env.example):
#     PWB_VERSION=2026.09.0
#     PCT_VERSION=2026.09.0
#     PPM_VERSION=2026.09.0
#
# Limitations:
#   - K8s-specific features (session capacity with resource profiles,
#     cluster commands) cannot be tested locally.
#   - Trial licenses may limit features or session duration.

services:
  workbench:
    image: ghcr.io/posit-dev/workbench:${PWB_VERSION:-latest}
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PWB_LICENSE: ${PWB_LICENSE:-}
      VIP_TEST_USERNAME: ${VIP_TEST_USERNAME:-vip_test}
      VIP_TEST_PASSWORD: ${VIP_TEST_PASSWORD:-vip_test_password}
      WORKBENCH_JUPYTER_PATH: /usr/local/bin/jupyter
    volumes:
      - workbench-home:/home
      - ./docker/workbench/startup.sh:/usr/local/bin/vip-create-test-user.sh:ro
    # The Workbench image runs no pre-start hook. Its ENTRYPOINT is
    # /usr/local/bin/entrypoint.sh, which installs an sssd supervisord program
    # and then `exec "$$@"`, and its supervisord.conf defines no cont-init
    # runner -- so /etc/cont-init.d does not exist and the 99-vip-setup mount
    # this service used to make there never created the vip_test account. That
    # was already true of the rstudio `:latest` this replaced (a frozen
    # 2022-08-19 build with ENTRYPOINT unset and nothing but a process monitor
    # in supervisord.conf), so local Workbench has never had the test user; the
    # OIDC and SAML lanes avoid the problem by wrapping the image with their own
    # entrypoint. Chain the same script in front of the stock entrypoint here,
    # which needs no build step. `command` has to restate the image's own CMD,
    # because overriding `entrypoint` in Compose discards it.
    entrypoint: ["/bin/bash", "-c", "bash /usr/local/bin/vip-create-test-user.sh && exec \"$$@\"", "--"]
    command: ["/usr/local/bin/entrypoint.sh", "/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  connect:
    image: ghcr.io/posit-dev/connect:${PCT_VERSION:-latest}
    ports:
      - "127.0.0.1:3939:3939"
    environment:
      PCT_LICENSE: ${PCT_LICENSE:-}
    volumes:
      - connect-data:/var/lib/rstudio-connect
      - ./docker/connect/rstudio-connect.gcfg:/etc/rstudio-connect/rstudio-connect.gcfg:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3939/__ping__"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - full
      - connect

  packagemanager:
    image: ghcr.io/posit-dev/package-manager:${PPM_VERSION:-latest}
    ports:
      - "127.0.0.1:4242:4242"
    environment:
      PPM_LICENSE: ${PPM_LICENSE:-}
    volumes:
      - pm-data:/var/lib/rstudio-pm
      - ./docker/packagemanager/rstudio-pm.gcfg:/etc/rstudio-pm/rstudio-pm.gcfg:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4242/__ping__"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - full
      - packagemanager

volumes:
  workbench-home:
  connect-data:
  pm-data:
