name: Release

# Calendar-versioned, weekly release train -- see docs/development.md
# ("Versioning and the release cadence") for the full rationale. Cuts
# Thursday evenings, plus on demand via workflow_dispatch. There is no
# `push` trigger: a merge to main no longer cuts a release by itself.
on:
  schedule:
    # 22:17 UTC = 6:17pm US Eastern in summer (drifts to 5:17pm in winter;
    # GitHub cron has no DST handling and that drift is accepted). The
    # off-the-hour minute avoids GitHub's heaviest scheduled-run delays at :00.
    - cron: "17 22 * * THU"
  workflow_dispatch:
    inputs:
      version:
        description: >
          Explicit version to release (e.g. 2026.7.1). Bypasses the
          no-commits-since-last-release gate, since supplying a version is a
          deliberate act -- but the version must still be strictly greater
          than the last release. Leave blank to release exactly like a
          scheduled run (computed version, same no-commits gate).
        required: false
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Determine last release tag
        id: last-tag
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ]; then
            echo "::error::No existing v* release tag found in this checkout"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A dispatch run with an explicit version bypasses the no-commits gate
      # below (supplying a version is a deliberate act), but still must not
      # publish backwards -- PyPI releases are unrecoverable. INPUT_VERSION
      # and LAST_TAG are passed via env rather than interpolated directly
      # into the script, same as SUITE in workbench-smoke.yml -- a
      # workflow_dispatch input is user-controlled text and should never be
      # substituted straight into a shell/script body.
      - name: Validate explicit version input
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
          LAST_TAG: ${{ steps.last-tag.outputs.tag }}
        run: |
          uv run python - "$INPUT_VERSION" "$LAST_TAG" <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from next_version import parse_tag

          candidate, last = sys.argv[1], sys.argv[2]
          if parse_tag(candidate) <= parse_tag(last):
              print(f"::error::--version {candidate} is not greater than the last release {last}")
              sys.exit(1)
          PY

      - name: Compute release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          LAST_TAG: ${{ steps.last-tag.outputs.tag }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version=$(uv run python scripts/next_version.py --last-tag "$LAST_TAG")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A dispatch run with no version input behaves exactly like a scheduled
      # run, including this gate -- it's a "release now" button, not an
      # override. Only an explicit --version bypasses it.
      - name: Check for commits since the last release
        if: inputs.version == ''
        id: gate
        env:
          LAST_TAG: ${{ steps.last-tag.outputs.tag }}
        run: |
          count=$(git rev-list "$LAST_TAG"..HEAD --count)
          echo "$count commit(s) since $LAST_TAG"
          if [ "$count" -eq 0 ]; then
            echo "No commits since the last release; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version in pyproject.toml
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv version "$VERSION" --frozen

      - name: Stamp src/vip/__init__.py
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" src/vip/__init__.py

      # Regenerates uv.lock's own posit-vip entry so it never lags behind the
      # version just stamped above. Runs the pinned uv version rather than a
      # bare `uv lock` so the justfile's UV_VERSION stays the single source
      # of truth. This -- plus committing uv.lock below -- is the fix for
      # issue #559; both steps must happen for that fix to hold.
      - name: Relock uv.lock
        if: steps.gate.outputs.skip != 'true'
        run: just relock

      # Sets the tag for a version that does not exist yet, generating its
      # changelog entry before the commit that carries it (and before the tag
      # itself) exists -- see docs/development.md for why this ordering
      # matters. Pinned like zizmor in ci.yml.
      - name: Update CHANGELOG.md
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uvx git-cliff==2.13.1 --tag "v${VERSION}" --unreleased --prepend CHANGELOG.md

      - name: Commit, tag, and push
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/vip/__init__.py uv.lock CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag "v${VERSION}"
          # --atomic is load-bearing, not a nicety. Without it git updates each
          # ref independently, so if a merge lands on main during this run the
          # branch push is rejected while the TAG still lands -- and publish.yml
          # triggers on tag push, publishing to PyPI a release commit that is not
          # on main. A PyPI version cannot be re-used once published, so that
          # state is unrecoverable. --atomic makes it both refs or neither.
          git push --atomic origin HEAD:main "v${VERSION}"
