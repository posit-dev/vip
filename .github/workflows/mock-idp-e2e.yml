name: Mock-IdP E2E Tests

# Exercises VIP's OIDC auth flows (--headless-auth and --interactive-auth)
# against real Connect and Workbench containers fronted by a real, seeded
# Keycloak realm -- no customer IdP required. See
# thoughts/shared/plans/2026-06-30-issue-409-robust-cicd-design.md (Child A).
#
# Unlike the smoke workflows (password auth against bare containers), this
# workflow is the only one that exercises the vip.idp Keycloak strategy and
# the OIDC branches of auth.py end-to-end with a real IdP round-trip.

on:
  push:
    branches: [main]
    paths:
      - 'src/vip/auth.py'
      - 'src/vip/idp.py'
      - 'src/vip/totp.py'
      - 'src/vip/cli.py'
      - 'src/vip_tests/conftest.py'
      - 'src/vip_tests/connect/test_auth.py'
      - 'src/vip_tests/connect/test_auth.feature'
      - 'src/vip_tests/workbench/test_auth.py'
      - 'src/vip_tests/workbench/test_auth.feature'
      - 'docker/keycloak/**'
      - 'docker/connect/**'
      - 'docker/workbench/**'
      - 'docker/tls/**'
      - 'compose.mock-idp.yml'
      - 'Dockerfile'
      - '.github/workflows/mock-idp-e2e.yml'
  pull_request:
  schedule:
    - cron: "30 5 * * *" # daily at 5:30am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-idp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'src/vip/auth.py'
              - 'src/vip/idp.py'
              - 'src/vip/totp.py'
              - 'src/vip/cli.py'
              - 'src/vip_tests/conftest.py'
              - 'src/vip_tests/connect/test_auth.py'
              - 'src/vip_tests/connect/test_auth.feature'
              - 'src/vip_tests/workbench/test_auth.py'
              - 'src/vip_tests/workbench/test_auth.feature'
              - 'docker/keycloak/**'
              - 'docker/connect/**'
              - 'docker/workbench/**'
              - 'docker/tls/**'
              - 'compose.mock-idp.yml'
              - 'Dockerfile'
              - '.github/workflows/mock-idp-e2e.yml'

  # Emit the Workbench version list for the E2E job. PR/push runs test only the
  # latest release (single required check, unchanged). Scheduled/manual runs fan
  # out across the Workbench support window (current + 2 back) — same list as
  # workbench-smoke.yml. Connect stays pinned to its stack default here; the
  # Connect version matrix lives in connect-smoke.yml (#441). Bump the pinned
  # tags when a new Workbench release ships; `release` always tracks newest.
  set-matrix:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'versions=["release", "2026.06.0", "2026.05.1"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["release"]' >> "$GITHUB_OUTPUT"
          fi

  mock-idp-e2e:
    needs: [set-matrix, changes]
    if: >-
      needs.changes.outputs.relevant == 'true'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    # Keep the original job name on the release (PR/push) leg so the PR-time
    # check name is unchanged; suffix only the pinned scheduled/manual legs.
    # `!=` first so the release leg yields '' rather than tripping the falsy-`||` trap.
    name: Mock-IdP E2E (headless-auth)${{ matrix.workbench-version != 'release' && format(' — Workbench {0}', matrix.workbench-version) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workbench-version: ${{ fromJSON(needs.set-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # All three services share one throwaway CA and terminate TLS under
      # *.vip.test -- both Connect's OpenIDConnectIssuer and Workbench's
      # auth-openid-issuer reject self-signed / bare-HTTP issuers. The runner
      # (VIP + Playwright's Chromium, via --ca-bundle) needs the same
      # hostnames to resolve to the published container ports.
      - name: Add vip.test hostnames
        run: |
          echo "127.0.0.1 keycloak.vip.test connect.vip.test workbench.vip.test" | sudo tee -a /etc/hosts

      # RSW_VERSION is the Workbench image tag baked into the compose build
      # (FROM rstudio/rstudio-workbench:${RSW_VERSION}). `release` maps to the
      # `latest` tag — the stack's existing default — so the PR/newest leg is
      # unchanged; pinned versions map to the `jammy-<version>` tags.
      - name: Start mock-IdP stack (Keycloak + Connect + Workbench)
        env:
          RSC_LICENSE: ${{ secrets.CONNECT_LICENSE }}
          RSW_LICENSE: ${{ secrets.WORKBENCH_LICENSE }}
          RSW_VERSION: ${{ matrix.workbench-version == 'release' && 'latest' || format('jammy-{0}', matrix.workbench-version) }}
        run: docker compose -f compose.mock-idp.yml up -d --build --wait

      # The default `docker` driver can't export to the GHA cache backend
      # (`type=gha` requires a buildx builder) -- see docker.yml for the same
      # pairing.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build VIP runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: vip-mock-idp-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bind-mounted into the runner container so its JSON/JUnit output lands
      # on the workflow runner's filesystem for the upload-artifact step
      # below.
      - name: Create output directory for test results
        run: mkdir -m 777 -p mock-idp-out

      # Runs on the host network so the container can resolve *.vip.test the
      # same way the runner just configured via /etc/hosts, and reach the
      # compose stack's published ports directly. Overrides the image's
      # default `uv run pytest` entrypoint to drive the CLI directly, the
      # same way a real user would.
      #
      # `--ca-bundle` only reaches Node/httpx's own TLS stack (NODE_EXTRA_CA_
      # CERTS) -- Playwright's Chromium on Linux validates certs against its
      # own NSS database (cert9.db), never the OS/OpenSSL trust store, so
      # `update-ca-certificates` alone has no effect on it (confirmed:
      # https://github.com/microsoft/playwright/issues/28967). The CA must
      # also be seeded into NSS via `certutil` (from libnss3-tools, not
      # installed by default) at the path Chromium actually reads:
      # sql:$HOME/.pki/nssdb. Runs as root (--user root) so apt-get/
      # update-ca-certificates/certutil can all write -- this is an
      # ephemeral, single-purpose CI container, not a shared host, so the
      # image's normal non-root convention doesn't buy anything here.
      #
      # --interactive-auth is intentionally NOT exercised by this job. This is
      # a settled headless-only CI stance, not deferred work: unlike
      # --headless-auth, it opens a headed browser and blocks waiting for a
      # *human* to click through the IdP's login form (auth.py's
      # start_interactive_auth has no form-filling logic of its own).
      # Automating it would need a second process driving the browser over
      # CDP (plus Xvfb, since this path insists on headless=False) while vip
      # verify blocks in the first process -- for thin marginal coverage,
      # since that second process's form-filling is test scaffolding that no
      # production code path shares. See the decision record at
      # thoughts/shared/plans/2026-07-08-issue-430-interactive-auth-headless-only.md
      # and the unit tests in selftests/test_auth.py
      # (TestStartInteractiveAuthPollLoop) covering the interactive-only
      # login-detection logic this stance relies on.
      # VIP_TEST_TOTP_SECRET is read from /certs/totp-secret.b32 at runtime
      # (generated by docker/keycloak/gen-totp-secret.sh into the shared
      # mock-idp-certs volume) rather than hardcoded here, since it must be
      # the base32 encoding of whatever raw secret cert-init baked into the
      # realm's seeded otp secretData.value -- see that script for why
      # Keycloak and pyotp need two different representations of one secret.
      - name: Run headless-auth E2E (Connect + Workbench)
        run: |
          docker run --rm --network host --user root \
            -v vip-mock-idp_mock-idp-certs:/certs:ro \
            -v "${{ github.workspace }}/mock-idp-out:/app/out" \
            -e VIP_TEST_USERNAME=vip_test \
            -e VIP_TEST_PASSWORD=vip_test_password \
            --entrypoint sh \
            vip-mock-idp-runner:latest \
            -c '
              cp /certs/ca.crt /usr/local/share/ca-certificates/vip-mock-idp-ca.crt &&
              update-ca-certificates &&
              apt-get update -qq && apt-get install -qq -y libnss3-tools > /dev/null &&
              mkdir -p "$HOME/.pki/nssdb" &&
              certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password &&
              certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n vip-mock-idp-ca -i /certs/ca.crt &&
              export VIP_TEST_TOTP_SECRET="$(cat /certs/totp-secret.b32)" &&
              exec uv run vip verify \
                --connect-url https://connect.vip.test:3939 \
                --workbench-url https://workbench.vip.test:8787 \
                --ca-bundle /certs/ca.crt \
                --headless-auth --idp keycloak \
                --categories "connect or workbench" \
                --filter "test_connect_login_ui or test_workbench_login" \
                --report out/results.json \
                -- --junitxml=out/mock-idp-results.xml --vip-verbose
            '

      # Placed after the E2E step (not just after "Start mock-IdP stack") so
      # a failure during the actual login flow -- not just container
      # startup -- still surfaces Keycloak/Connect/Workbench container logs
      # for diagnosis. `docker compose logs` also emits `if: failure()`
      # logs from a startup failure by the time this runs, since the
      # containers are still up (torn down separately, below).
      - name: Surface stack logs on failure
        if: failure()
        run: docker compose -f compose.mock-idp.yml logs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mock-idp-e2e-results-headless-${{ matrix.workbench-version }}
          path: mock-idp-out/
          if-no-files-found: ignore

      - name: Stop mock-IdP stack
        if: always()
        run: docker compose -f compose.mock-idp.yml down -v

  # DIAGNOSTIC job for issue #263 (Workbench behind SAML on a separate
  # hostname from Connect). This job's expected outcome is RED -- its
  # purpose is to reproduce a suspected defect in `_authenticate_workbench`
  # so the fix (to src/vip/auth.py) can be written against an observed
  # failure rather than an inference. See
  # thoughts/shared/plans/2026-08-17-issue-263-saml-diagnostic-plan.md.
  #
  # It therefore:
  #   - runs only on workflow_dispatch (never push/PR/schedule), so it can
  #     never block a merge or a nightly;
  #   - sets `continue-on-error: true` at the job level, so even a failing
  #     run reports green to anything that depends on this workflow;
  #   - is deliberately NOT in the `status` job's `needs:` below, so it can
  #     never affect that aggregation either.
  # Once the auth.py fix lands and this job goes green on its own merits,
  # promote it: drop `continue-on-error`, fold it into (or replace)
  # `mock-idp-e2e` above, and add it to `status`'s `needs:`.
  mock-idp-e2e-saml-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    name: Mock-IdP E2E SAML diagnostic (issue #263, expected red)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same as the headless-auth job's hostname step, plus the SAML lane's
      # own hostname (docker/workbench/entrypoint-saml.sh,
      # compose.mock-idp.yml's `workbench-saml` service).
      - name: Add vip.test hostnames
        run: |
          echo "127.0.0.1 keycloak.vip.test connect.vip.test workbench.vip.test workbench-saml.vip.test" | sudo tee -a /etc/hosts

      # `--profile saml` additionally builds and starts `workbench-saml`
      # (see compose.mock-idp.yml); the OIDC `workbench` service and
      # everything else in the stack come up exactly as they do in the
      # headless-auth job above.
      - name: Start mock-IdP stack with SAML lane (Keycloak + Connect + Workbench + Workbench-SAML)
        env:
          RSC_LICENSE: ${{ secrets.CONNECT_LICENSE }}
          RSW_LICENSE: ${{ secrets.WORKBENCH_LICENSE }}
        run: docker compose -f compose.mock-idp.yml --profile saml up -d --build --wait

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build VIP runner image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: vip-mock-idp-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create output directory for test results
        run: mkdir -m 777 -p mock-idp-out

      # Two runs, mirroring Task 4 of the diagnostic plan: (a) Workbench-only
      # against the SAML lane, (b) both products on separate hostnames --
      # the actual #263 topology. `set -o pipefail` is required here: the
      # default GHA bash shell runs `bash -e {0}` with no pipefail, so
      # `docker run ... | tee file` would otherwise report this step as
      # successful even when `vip verify` inside the container fails.
      #
      # Step (b) below carries `if: always()` so it still runs -- and its
      # log still gets captured -- even when this step fails, which is the
      # "continuing past failure so we get both logs" requirement. Neither
      # step swallows its own exit code (no `|| true`), so a real failure
      # here still fails the step, which is what lets "Surface stack logs on
      # failure" below fire via the normal `if: failure()` idiom; the job's
      # `continue-on-error: true` above is what keeps that from blocking
      # anything downstream.
      #
      # NOTE: --interactive-auth is NOT covered by this diagnostic, for the
      # same reason it is not exercised by the headless-auth job above (see
      # that job's comment) -- it opens a headed browser and blocks on a
      # human. Issue #263 was reported under --interactive-auth; this probes
      # with --headless-auth because both modes share `_authenticate_workbench`
      # in auth.py, which is where the leading hypothesis sits -- but a
      # defect specific to the interactive-only prompt path would not show
      # up here.
      - name: Run SAML diagnostic (Workbench-only)
        run: |
          set -o pipefail
          docker run --rm --network host --user root \
            -v vip-mock-idp_mock-idp-certs:/certs:ro \
            -v "${{ github.workspace }}/mock-idp-out:/app/out" \
            -e VIP_TEST_USERNAME=vip_test \
            -e VIP_TEST_PASSWORD=vip_test_password \
            --entrypoint sh \
            vip-mock-idp-runner:latest \
            -c '
              cp /certs/ca.crt /usr/local/share/ca-certificates/vip-mock-idp-ca.crt &&
              update-ca-certificates &&
              apt-get update -qq && apt-get install -qq -y libnss3-tools > /dev/null &&
              mkdir -p "$HOME/.pki/nssdb" &&
              certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password &&
              certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n vip-mock-idp-ca -i /certs/ca.crt &&
              export VIP_TEST_TOTP_SECRET="$(cat /certs/totp-secret.b32)" &&
              exec uv run vip verify \
                --workbench-url https://workbench-saml.vip.test:8788 \
                --ca-bundle /certs/ca.crt \
                --headless-auth --idp keycloak --provider saml \
                --categories workbench \
                --filter test_workbench_login \
                --report out/results-saml-workbench-only.json \
                -- --junitxml=out/mock-idp-results-saml-workbench-only.xml --vip-verbose
            ' 2>&1 | tee mock-idp-out/saml-workbench-only.log

          # TEMPORARY: a genuine Workbench auth failure surfaces as
          # pytest.skip, so `vip verify` exits 0 and this step reports a
          # false green even though the login test we care about never ran
          # ("1 passed, 2 skipped"). The durable fix is #596 (a real vip
          # verify exit-code contract); until that lands, assert directly
          # that the login test(s) for the product URL(s) passed above
          # actually executed. Checking named tests rather than the
          # testsuite's skipped= count matters: prerequisites/
          # test_expected_failure always skips unless
          # VIP_ENABLE_EXPECTED_FAILURE_DEMO is set, so a count-based guard
          # would fail every run regardless of #263. Deliberately duplicated
          # in both steps so the whole block lifts out cleanly once #596
          # ships.
          python3 - mock-idp-out/mock-idp-results-saml-workbench-only.xml test_workbench_login <<'PY'
          import sys, xml.etree.ElementTree as ET

          xml_path, *required = sys.argv[1:]
          cases = {tc.get("name", ""): tc for tc in ET.parse(xml_path).iter("testcase")}
          problems = []
          for want in required:
              matched = [n for n in cases if want in n]
              if not matched:
                  problems.append(f"{want}: never collected")
              problems += [f"{n}: skipped" for n in matched if cases[n].find("skipped") is not None]
          if problems:
              print("::error::The SAML workbench-only run did not execute its login test(s) -- " + "; ".join(problems) + " (see #596)")
              sys.exit(1)
          PY

      - name: Run SAML diagnostic (Connect + Workbench, the #263 topology)
        if: always()
        run: |
          set -o pipefail
          docker run --rm --network host --user root \
            -v vip-mock-idp_mock-idp-certs:/certs:ro \
            -v "${{ github.workspace }}/mock-idp-out:/app/out" \
            -e VIP_TEST_USERNAME=vip_test \
            -e VIP_TEST_PASSWORD=vip_test_password \
            --entrypoint sh \
            vip-mock-idp-runner:latest \
            -c '
              cp /certs/ca.crt /usr/local/share/ca-certificates/vip-mock-idp-ca.crt &&
              update-ca-certificates &&
              apt-get update -qq && apt-get install -qq -y libnss3-tools > /dev/null &&
              mkdir -p "$HOME/.pki/nssdb" &&
              certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password &&
              certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n vip-mock-idp-ca -i /certs/ca.crt &&
              export VIP_TEST_TOTP_SECRET="$(cat /certs/totp-secret.b32)" &&
              exec uv run vip verify \
                --connect-url https://connect.vip.test:3939 \
                --workbench-url https://workbench-saml.vip.test:8788 \
                --ca-bundle /certs/ca.crt \
                --headless-auth --idp keycloak --provider saml \
                --categories "connect or workbench" \
                --filter "test_connect_login_ui or test_workbench_login" \
                --report out/results-saml-both.json \
                -- --junitxml=out/mock-idp-results-saml-both.xml --vip-verbose
            ' 2>&1 | tee mock-idp-out/saml-both.log

          # TEMPORARY: a genuine Workbench auth failure surfaces as
          # pytest.skip, so `vip verify` exits 0 and this step reports a
          # false green even though the login test we care about never ran
          # ("1 passed, 2 skipped"). The durable fix is #596 (a real vip
          # verify exit-code contract); until that lands, assert directly
          # that the login test(s) for the product URL(s) passed above
          # actually executed. Checking named tests rather than the
          # testsuite's skipped= count matters: prerequisites/
          # test_expected_failure always skips unless
          # VIP_ENABLE_EXPECTED_FAILURE_DEMO is set, so a count-based guard
          # would fail every run regardless of #263. Deliberately duplicated
          # in both steps so the whole block lifts out cleanly once #596
          # ships.
          python3 - mock-idp-out/mock-idp-results-saml-both.xml test_connect_login_ui test_workbench_login <<'PY'
          import sys, xml.etree.ElementTree as ET

          xml_path, *required = sys.argv[1:]
          cases = {tc.get("name", ""): tc for tc in ET.parse(xml_path).iter("testcase")}
          problems = []
          for want in required:
              matched = [n for n in cases if want in n]
              if not matched:
                  problems.append(f"{want}: never collected")
              problems += [f"{n}: skipped" for n in matched if cases[n].find("skipped") is not None]
          if problems:
              print("::error::The SAML Connect+Workbench run did not execute its login test(s) -- " + "; ".join(problems) + " (see #596)")
              sys.exit(1)
          PY

      # Same placement rationale as the headless-auth job's identical step:
      # after both E2E attempts, not just after stack startup, so a login-flow
      # failure -- not just a container-startup failure -- still surfaces logs.
      - name: Surface stack logs on failure
        if: failure()
        run: docker compose -f compose.mock-idp.yml --profile saml logs

      - name: Upload SAML diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mock-idp-e2e-saml-diagnostic-results
          path: mock-idp-out/
          if-no-files-found: ignore

      - name: Stop mock-IdP stack
        if: always()
        run: docker compose -f compose.mock-idp.yml --profile saml down -v

  status:
    name: Mock-IdP E2E Status
    if: always()
    needs: [changes, set-matrix, mock-idp-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [ "${{ needs.changes.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "cancelled" ]; then
            echo "Change-detection job failed; cannot confirm E2E scope"
            exit 1
          fi
          # A failed set-matrix skips (not fails) mock-idp-e2e, which the
          # check below would otherwise read as a clean skip.
          if [ "${{ needs.set-matrix.result }}" = "failure" ] || [ "${{ needs.set-matrix.result }}" = "cancelled" ]; then
            echo "Version-matrix job failed; cannot confirm E2E scope"
            exit 1
          fi
          # If auth paths changed, the E2E suite was in scope and MUST have
          # succeeded — a skip means it was gated out, not legitimately absent.
          if [ "${{ needs.changes.outputs.relevant }}" = "true" ] && [ "${{ needs.mock-idp-e2e.result }}" != "success" ]; then
            echo "Mock-IdP E2E was in scope but did not succeed (result=${{ needs.mock-idp-e2e.result }})"
            exit 1
          fi
          if [ "${{ needs.mock-idp-e2e.result }}" = "failure" ] || [ "${{ needs.mock-idp-e2e.result }}" = "cancelled" ]; then
            echo "Mock-IdP E2E tests failed or were cancelled"
            exit 1
          fi
          echo "Mock-IdP E2E tests passed or were legitimately out of scope"
