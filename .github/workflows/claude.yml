name: Claude PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  pull_request:
    # Trigger for workflow testing
    paths:
      - '.github/workflows/claude.yml'

jobs:
  claude-code-action:
    # This is a public repo, so only respond to posit-dev org members. The action
    # also checks for write access, but gating here skips the job (and the token
    # and AWS credential steps) entirely for everyone else.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER"]'), github.event.review.author_association)) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Generate token for GitHub App
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.POSIT_VIP_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.POSIT_VIP_TRIAGE_PEM }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ steps.generate-token.outputs.token }}

      # Install some stuff so that Claude can run tests etc.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install just
        run: |
          VERSION=1.58.0
          SHA256=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          tmp="$(mktemp -d)"
          curl -sSfL --retry 3 -o "${tmp}/just.tar.gz" \
            "https://github.com/casey/just/releases/download/${VERSION}/just-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${SHA256}  ${tmp}/just.tar.gz" | sha256sum -c -
          tar -xzf "${tmp}/just.tar.gz" -C "${tmp}" just
          sudo install "${tmp}/just" /usr/local/bin/just
          rm -rf "${tmp}"
          just --version

      # The AWS assume role step has this validation:
      # Member must satisfy regular expression pattern: [\w+=,.@-]*
      # so we should sanitize e.g. `[bot]` so that it is not rejected
      - name: Sanitize role session name
        id: session-name
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "value=$(echo "$TRIGGERING_ACTOR" | sed 's/[^a-zA-Z0-9_+=,.@-]/_/g')" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::440849847947:role/claude-code-gha
          role-session-name: ${{ steps.session-name.outputs.value }}
          aws-region: us-east-2

      # Determine who to assign to issues/PRs created by Claude.
      # If the triggering actor is a human, use them directly.
      # If it's a bot, fall back to the origin issue/PR's assignee or author.
      - name: Determine assignee
        id: assignee
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ASSIGNEE: ${{ github.event.issue.assignees[0].login }}${{ github.event.pull_request.assignees[0].login }}
          AUTHOR: ${{ github.event.issue.user.login }}${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$TRIGGERING_ACTOR" != *"[bot]"* && "$TRIGGERING_ACTOR" != *"_bot"* ]]; then
            echo "value=$TRIGGERING_ACTOR" >> "$GITHUB_OUTPUT"
          else
            echo "value=${ASSIGNEE:-$AUTHOR}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate branch prefix
        id: branch-prefix
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TITLE="${ISSUE_TITLE:-$PR_TITLE}"
          NUMBER="${ISSUE_NUMBER:-$PR_NUMBER}"
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-40)
          echo "value=claude/${NUMBER}-${SLUG}-" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: us.anthropic.claude-opus-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: us.anthropic.claude-sonnet-5-5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: us.anthropic.claude-haiku-5-5
        with:
          use_bedrock: true
          show_full_output: true
          github_token: ${{ steps.generate-token.outputs.token }}
          branch_prefix: ${{ steps.branch-prefix.outputs.value }}
          additional_permissions: "actions: read"
          track_progress: true
          prompt: |
            You are a helpful AI assistant for code reviews and issue triage.
            Respond to comments and issues that mention you by creating pull requests, summarizing research, updating issues, and otherwise providing actionable advice.
            Keep issue and pull request text brief.
            Lead with the result.
            Include only actionable findings.
            Do not repeat resolved findings or successful checks unless they affect the result.

            Follow the guidelines in CLAUDE.md. In particular: run commands through `uv run`,
            run `just check` and `uv run pytest selftests/` before pushing, and include a
            showboat demo (saved with `just demo-save <name>`) in any pull request you create.

            When you implement code changes for an issue, create a pull request using
            mcp__github__create_pull_request. The PR title must use conventional commit format
            (see the "PR titles" section of CLAUDE.md), and the PR body must include the demo
            contents under a `## Demo` heading.
            If PR creation fails, push the branch and include a link to create the PR in your comment.

            If your change is fixing a bug, always write or modify tests that reproduce the bug first,
            push those as a separate commit and ensure that CI fails before then pushing the actual
            fix. If you are modifying existing code, check if there are existing tests and update
            them or put new tests alongside the old ones.

            For any task involving real build/test work, commit and push progress to your branch
            after each logical, verified increment rather than waiting until the whole task is done
            to make your first commit. A commit that only exists locally is equivalent to no commit
            at all once this job's runner is torn down — only what is pushed survives a timeout or
            cancellation.

            Before your first commit, write a short status document (e.g. `PROGRESS.md` at the repo
            root) noting your plan and which steps remain. Commit it alongside your first change, and
            update it — checking off completed steps and noting what's left — with each subsequent
            commit. This lets a resumed run, or a human picking up the branch after a timeout, see
            what's done and where to continue. When the task is complete, delete this file in your
            final commit. This applies whether that final commit precedes creating a new pull request
            or is a push to an existing branch — the file must not appear in a finished PR's diff.

            After creating a PR, add a reviewer and assignee. If the triggering user (${{ github.triggering_actor }}) is not a bot,
            add them with: gh pr edit <PR_NUMBER> --add-reviewer ${{ github.triggering_actor }} --add-assignee ${{ steps.assignee.outputs.value }}
            Otherwise, only add the assignee: gh pr edit <PR_NUMBER> --add-assignee ${{ steps.assignee.outputs.value }}

            After creating an issue, add an assignee: gh issue edit <ISSUE_NUMBER> --add-assignee ${{ steps.assignee.outputs.value }}

            When labeling an issue or pull request, only apply labels that already exist in the
            repository — never create a new one. First list the existing labels with
            `gh label list --limit 300`, then choose the closest existing match (for example
            `bug`, `enhancement`, `documentation`, or a `team: ...` label for product-specific work).
            If no existing label is a good fit, leave the item unlabeled instead of creating a new label.
          claude_args: |
            --model opus
            --fallback-model haiku
            --allowedTools WebFetch,WebSearch,Bash,Read,mcp__github__create_pull_request,mcp__github__create_issue,mcp__github__search_issues,mcp__github__update_issue,mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff,mcp__github__sub_issue_write
