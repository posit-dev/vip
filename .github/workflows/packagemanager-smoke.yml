name: Package Manager Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/packagemanager-smoke.yml'
      - '.github/workflows/recent-production-versions.yml'
      - '.github/actions/check-license-errors/**'
      - '.github/actions/setup-vip/**'
      - '.github/actions/write-smoke-summary/**'
      - '.github/actions/rename-smoke-job/**'
      - '.github/actions/check-smoke-status/**'
      - 'scripts/ci/wait-for-package-manager.sh'
  pull_request:
  # Scheduled/manual runs fan the suite out across the Package Manager support
  # window (see the set-matrix job). PR/push runs stay single-version.
  schedule:
    - cron: "30 6 * * *" # daily at 06:30 UTC (staggered from the other smoke workflows)
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# Pushes to a PR branch cancel that PR's older run. Every other event keys on
# its own run id, so runs on main, schedules and tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'src/vip_tests/package_manager/**'
              - 'src/vip/clients/packagemanager.py'
              # shared across all smoke workflows:
              - 'src/vip_tests/prerequisites/**'
              # shared core — affects all products:
              - 'src/vip/auth/**'
              - 'src/vip/idp.py'
              - 'src/vip/config.py'
              - 'src/vip/plugin/**'
              - 'src/vip/cli/**'
              - 'src/vip/clients/base.py'
              - 'src/vip/timeouts.py'
              - 'src/vip_tests/conftest.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/packagemanager-smoke.yml'
              - '.github/workflows/recent-production-versions.yml'
              - '.github/actions/check-license-errors/**'
              - '.github/actions/setup-vip/**'
              - '.github/actions/write-smoke-summary/**'
              - '.github/actions/rename-smoke-job/**'
              - '.github/actions/check-smoke-status/**'
              - 'scripts/ci/wait-for-package-manager.sh'

  # Emit the Package Manager tag list for the product job. PR/push runs the
  # current release only (single required check, unchanged); scheduled/manual
  # runs fan out across the support window (current + 2 back). Nothing to bump
  # by hand any more -- the tags are resolved from
  # ghcr.io/posit-dev/package-manager's own tag list at run time, so a run is
  # reproducible only in the sense that the resolved version is recorded in the
  # job name and summary, not that it is fixed. PM skips some months (there is
  # no 2026.07 release), so "current + 2 back" means the last three months that
  # shipped, which is what the resolver returns.
  set-matrix:
    uses: ./.github/workflows/recent-production-versions.yml
    with:
      image: package-manager
      count: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 3 || 1 }}

  packagemanager-smoke:
    needs: [changes, set-matrix]
    # Scheduled/manual runs always execute (no PR diff for paths-filter to
    # score); PR/push runs still gate on the changed-paths filter.
    if: >-
      needs.changes.outputs.relevant == 'true'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    name: Smoke test against Package Manager ${{ matrix.pm-version }}
    runs-on: ubuntu-latest
    # Measured ~1.7 min median.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pm-version: ${{ fromJSON(needs.set-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The job only runs when PM smoke is in scope (changed paths) or on a
      # scheduled/manual run -- all cases where the suite is meant to execute.
      # A missing license secret therefore means the required gate cannot be
      # satisfied, so fail loudly instead of silently skipping every test step
      # (which would otherwise report a green required check with zero coverage).
      - name: Check for RSPM_LICENSE
        id: license
        run: |
          if [ -z "${{ secrets.RSPM_LICENSE }}" ]; then
            echo "::error::RSPM_LICENSE secret is not configured; Package Manager smoke cannot run. Set the RSPM_LICENSE repository secret."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      # ghcr.io/posit-dev/package-manager is public, so the pull below is
      # anonymous -- no `docker login` step and no `packages: read` permission.
      # Start Package Manager in Docker
      - name: Start Package Manager
        if: steps.license.outputs.available == 'true'
        id: pm
        run: |
          docker run -d \
            --name packagemanager \
            -p 4242:4242 \
            -e PPM_LICENSE="${{ secrets.RSPM_LICENSE }}" \
            ghcr.io/posit-dev/package-manager:${{ matrix.pm-version }}
          echo "PM_URL=http://localhost:4242" >> "$GITHUB_OUTPUT"

      # Wait for health check
      - name: Wait for Package Manager to be ready
        if: steps.license.outputs.available == 'true'
        run: bash scripts/ci/wait-for-package-manager.sh

      # Surface license errors as workflow annotations so expired keys
      # are immediately visible on the Actions run page.
      - name: Check for license errors
        if: failure() && steps.license.outputs.available == 'true'
        uses: ./.github/actions/check-license-errors
        with:
          product: Package Manager
          secret-name: RSPM_LICENSE
          container: packagemanager

      # Provision CRAN and PyPI repositories for smoke testing
      - name: Provision smoke test repositories
        if: steps.license.outputs.available == 'true'
        run: |
          echo "Creating CRAN repository..."
          docker exec packagemanager /opt/rstudio-pm/bin/rspm create repo \
            --name=cran-all --type=r --description="CRAN mirror"
          docker exec packagemanager /opt/rstudio-pm/bin/rspm create source \
            --name=cran-mirror --type=cran-snapshot
          docker exec packagemanager /opt/rstudio-pm/bin/rspm subscribe \
            --repo=cran-all --source=cran-mirror

          echo "Creating PyPI repository..."
          docker exec packagemanager /opt/rstudio-pm/bin/rspm create repo \
            --name=pypi-all --type=python --description="PyPI mirror"

          echo "Repositories provisioned successfully"

      # Resolve the actual Package Manager version
      - name: Resolve Package Manager version
        if: steps.license.outputs.available == 'true'
        id: version
        run: |
          RESPONSE=$(curl -sf http://localhost:4242/__api__/status)
          VERSION=$(echo "${RESPONSE}" | jq -r '.version // empty')
          if [ -z "${VERSION}" ]; then
            # Fall back to the matrix version if API doesn't report it
            VERSION="${{ matrix.pm-version }}"
          fi
          echo "Resolved Package Manager version: ${VERSION}"
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      # Rename the check run to show the resolved version
      - name: Update job title with resolved version
        if: steps.license.outputs.available == 'true'
        uses: ./.github/actions/rename-smoke-job
        with:
          product: Package Manager
          requested-version: ${{ matrix.pm-version }}
          resolved-version: ${{ steps.version.outputs.resolved }}

      # Set up Python and install VIP
      - name: Set up VIP
        if: steps.license.outputs.available == 'true'
        uses: ./.github/actions/setup-vip

      # Generate vip.toml for CI Package Manager
      - name: Configure VIP for CI Package Manager
        if: steps.license.outputs.available == 'true'
        run: |
          cat > vip.toml << EOF
          [general]
          deployment_name = "CI Package Manager"

          [package_manager]
          enabled = true
          url = "${{ steps.pm.outputs.PM_URL }}"
          version = "${{ steps.version.outputs.resolved }}"

          [auth]
          provider = "password"
          EOF

      # Run the Package Manager smoke tests
      - name: Run Package Manager smoke tests
        if: steps.license.outputs.available == 'true'
        run: |
          uv run pytest \
            "src/vip_tests/prerequisites/test_components.py::test_product_server_is_reachable[Package Manager]" \
            src/vip_tests/prerequisites/test_versions.py \
            src/vip_tests/package_manager/test_repos.py \
            src/vip_tests/package_manager/test_binary_packages.py \
            src/vip_tests/package_manager/test_authenticated_repos.py \
            src/vip_tests/package_manager/test_private_repos.py \
            src/vip_tests/package_manager/test_ui.py \
            src/vip_tests/cross_product/test_resources.py \
            src/vip_tests/config_hygiene/test_secrets.py \
            -v \
            --vip-config=vip.toml \
            --junitxml=smoke-results.xml

      # Tolerant, unretried upload -- see connect-smoke.yml's "Upload test
      # results" step for the full rationale, including why no safe retry
      # was found. The license gate is unchanged from before this PR.
      - name: Upload test results
        id: upload-results
        if: always() && steps.license.outputs.available == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pm-smoke-results-${{ matrix.pm-version }}
          path: smoke-results.xml

      # Write a rich job summary with test details
      - name: Write workflow summary (license missing)
        if: always() && steps.license.outputs.available != 'true'
        run: |
          {
            echo "## Package Manager Smoke Tests — Skipped"
            echo ""
            echo "> RSPM_LICENSE secret is not configured. Add it to run PM smoke tests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write workflow summary
        if: always() && steps.license.outputs.available == 'true'
        uses: ./.github/actions/write-smoke-summary
        with:
          product: Package Manager
          requested-version: ${{ matrix.pm-version }}
          resolved-version: ${{ steps.version.outputs.resolved }}
          url: ${{ steps.pm.outputs.PM_URL }}

      # Stop Package Manager
      - name: Stop Package Manager
        if: always() && steps.license.outputs.available == 'true'
        run: docker stop packagemanager && docker rm packagemanager || true

  status:
    name: Package Manager Smoke Tests Status
    if: always()
    needs: [changes, set-matrix, packagemanager-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check smoke test result
        uses: ./.github/actions/check-smoke-status
        with:
          product: Package Manager
          changes-result: ${{ needs.changes.result }}
          set-matrix-result: ${{ needs.set-matrix.result }}
          relevant: ${{ needs.changes.outputs.relevant }}
          suites: |
            Package Manager smoke tests|${{ needs.packagemanager-smoke.result }}
          in-scope-hint: "; is RSPM_LICENSE configured?"

      # Nightly failures have no PR author to notice them; file (or update) a
      # tracking issue instead of failing silently. Never fires on push/pull_request
      # -- the author already sees those runs.
      - name: Notify on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/notify-on-scheduled-failure
        with:
          workflow-name: Package Manager Smoke Tests
          github-token: ${{ secrets.GITHUB_TOKEN }}
