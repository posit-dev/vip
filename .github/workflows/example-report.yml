name: Example Validation Report

on:
  workflow_call:

jobs:
  build:
    name: Build example report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlike Workbench and Package Manager, Connect has no license-gate
      # step: this workflow always builds a [connect] section (see "Configure
      # VIP for CI" below) and the published report is anchored on Connect, so
      # there is no graceful-degradation path that would still produce a
      # meaningful example. Fail loudly and immediately, the same way
      # packagemanager-smoke.yml treats a missing RSPM_LICENSE, rather than
      # letting the "Start Connect" step fail opaquely deep in with-connect.
      - name: Check for CONNECT_LICENSE
        run: |
          if [ -z "${{ secrets.CONNECT_LICENSE }}" ]; then
            echo "::error::CONNECT_LICENSE secret is not configured; the example report cannot be built without Connect. Set the CONNECT_LICENSE repository secret."
            exit 1
          fi

      # Free disk space before pulling the Connect, Workbench, and Package
      # Manager images plus the Playwright Chromium download. The default
      # ubuntu-latest root volume (~14 GB free) otherwise fills up and the
      # "Install Playwright browsers" step dies with "No space left on device".
      # tool-cache is preserved so setup-uv and quarto-actions keep their caches.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # Skip Package Manager steps if the license secret is not configured
      - name: Check for RSPM_LICENSE
        id: pm-license
        run: |
          if [ -z "${{ secrets.RSPM_LICENSE }}" ]; then
            echo "RSPM_LICENSE secret not configured — skipping Package Manager steps"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for WORKBENCH_LICENSE
        id: wb-license
        run: |
          if [ -z "${{ secrets.WORKBENCH_LICENSE }}" ]; then
            echo "WORKBENCH_LICENSE secret not configured — skipping Workbench steps"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Install Quarto before service containers consume disk space.
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.37

      # Start Connect in Docker
      - name: Start Connect
        id: connect
        uses: posit-dev/with-connect@4f26a6a301716789d6451cc3afd878afdd52189b # main
        with:
          version: release
          license: ${{ secrets.CONNECT_LICENSE }}

      # Start Workbench in Docker
      - name: Start Workbench
        if: steps.wb-license.outputs.available == 'true'
        id: workbench
        uses: posit-dev/with-workbench@da367f7337b28c6748f7dd43d08706788353be8d # main
        with:
          license-key: ${{ secrets.WORKBENCH_LICENSE }}
          version: release

      # Surface Workbench license errors
      - name: Check for Workbench license errors
        if: failure() && steps.wb-license.outputs.available == 'true' && steps.workbench.outcome == 'failure'
        run: |
          CID=$(docker ps -aq --filter "ancestor=rstudio/rstudio-workbench" | head -1)
          if [ -z "${CID}" ]; then
            echo "::error title=Workbench Startup Failed::Workbench container not found."
            exit 1
          fi
          LOGS=$(docker logs "${CID}" 2>&1 || true)
          LICENSE_MSG=$(echo "${LOGS}" | grep -i "license" | grep -iE "expired|invalid|unable|not activated" | head -1 || true)
          if [ -n "${LICENSE_MSG}" ]; then
            echo "::error title=Workbench License Error::${LICENSE_MSG}"
            {
              echo "## Workbench License Error"
              echo ""
              echo "The Workbench license key is expired or invalid. Update the \`WORKBENCH_LICENSE\` repository secret."
              echo ""
              echo '```'
              echo "${LICENSE_MSG}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Workbench Startup Failed::Workbench failed to start. Check the 'Start Workbench' step logs."
          fi
          exit 1

      # Resolve Workbench version
      - name: Resolve Workbench version
        if: steps.wb-license.outputs.available == 'true'
        id: wb-version
        run: |
          curl -s -L -c /tmp/wb_cookies.txt \
            -d "username=${{ steps.workbench.outputs.WORKBENCH_USER }}&password=${{ steps.workbench.outputs.WORKBENCH_PASSWORD }}" \
            ${{ steps.workbench.outputs.WORKBENCH_URL }}/auth-sign-in > /dev/null

          RESPONSE=$(curl -s -b /tmp/wb_cookies.txt ${{ steps.workbench.outputs.WORKBENCH_URL }}/api/server-info)
          VERSION=$(echo "${RESPONSE}" | jq -r '.version // empty' 2>/dev/null || true)

          if [ -z "${VERSION}" ]; then
            VERSION=$(docker exec ${{ steps.workbench.outputs.CONTAINER_ID }} rstudio-server version 2>/dev/null \
                      | grep -oE '[0-9]{4}\.[0-9]+\.[0-9]+\+[^[:space:]]+' | head -1 || true)
          fi

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Could not resolve Workbench version"
            exit 1
          fi

          echo "Resolved Workbench version: ${VERSION}"
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      # Resolve the actual Connect version for unambiguous job records
      - name: Resolve Connect version
        id: version
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: Key ${{ steps.connect.outputs.CONNECT_API_KEY }}" \
            "${{ steps.connect.outputs.CONNECT_SERVER }}/__api__/server_settings")
          VERSION=$(echo "${RESPONSE}" | jq -r '.version')
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "ERROR: Could not resolve Connect version from server_settings"
            echo "Response body: ${RESPONSE}"
            exit 1
          fi
          echo "Resolved Connect version: ${VERSION}"
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      # with-workbench's default `user` input is "testuser" (see
      # posit-dev/with-workbench's action.yml), and that name flows into the
      # shared [auth] section below, which every product test reads via the
      # test_username/test_password fixtures. Connect has no equivalent
      # account -- with-connect only exposes an API key, never a
      # username/password -- so create one that matches, via the same API key
      # the "Resolve Connect version" step above already validated. This
      # keeps "the test user exists in the user list" (test_users.py) honest
      # instead of relying on an account Connect never created. It also gives
      # the UI-login scenario real credentials to submit, though note that
      # scenario cannot currently detect the difference either way: Connect
      # 303-redirects GET /__login__ to <dashboard>/#/login before any
      # credentials are entered, so its "we left /__login__" assertion is
      # vacuous. Tracked separately; do not read a passing login scenario here
      # as evidence this step worked.
      #
      # The credentials go through the environment rather than being
      # interpolated straight into the JSON body: a password containing a
      # quote would otherwise break the shell quoting and produce a
      # malformed request. An already-existing account is treated as success
      # so re-runs stay idempotent, and any other non-2xx prints the response
      # body -- `curl -sf >/dev/null` would fail the job with no diagnostics
      # at all.
      - name: Provision Connect test user
        if: steps.wb-license.outputs.available == 'true'
        env:
          CONNECT_SERVER: ${{ steps.connect.outputs.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ steps.connect.outputs.CONNECT_API_KEY }}
          TEST_USER: ${{ steps.workbench.outputs.WORKBENCH_USER }}
          TEST_PASSWORD: ${{ steps.workbench.outputs.WORKBENCH_PASSWORD }}
        run: |
          BODY=$(jq -nc \
            --arg u "${TEST_USER}" \
            --arg p "${TEST_PASSWORD}" \
            '{username: $u, email: ($u + "@example.com"), password: $p, user_role: "publisher"}')
          HTTP_CODE=$(curl -s -o /tmp/create_user.json -w '%{http_code}' -X POST \
            -H "Authorization: Key ${CONNECT_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${BODY}" \
            "${CONNECT_SERVER}/__api__/v1/users")
          case "${HTTP_CODE}" in
            2??)
              echo "Created Connect user '${TEST_USER}'"
              ;;
            409)
              # Idempotent re-run: Connect returns 409 when the username is
              # taken. Print the body rather than swallowing it, so a 409
              # raised by some other uniqueness constraint is still visible in
              # the log instead of passing silently as "already exists".
              echo "Connect user '${TEST_USER}' already exists; nothing to do. Response:"
              cat /tmp/create_user.json
              ;;
            *)
              echo "ERROR: creating Connect user '${TEST_USER}' returned HTTP ${HTTP_CODE}"
              cat /tmp/create_user.json
              exit 1
              ;;
          esac

      # Start Package Manager in Docker
      - name: Start Package Manager
        if: steps.pm-license.outputs.available == 'true'
        id: pm
        run: |
          docker run -d \
            --name packagemanager \
            -p 4242:4242 \
            -e RSPM_LICENSE="${{ secrets.RSPM_LICENSE }}" \
            rstudio/rstudio-package-manager:ubuntu2204
          echo "PM_URL=http://localhost:4242" >> "$GITHUB_OUTPUT"

      # Wait for Package Manager health check
      - name: Wait for Package Manager to be ready
        if: steps.pm-license.outputs.available == 'true'
        run: |
          echo "Waiting for Package Manager to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4242/__api__/status > /dev/null 2>&1; then
              echo "Package Manager is ready (attempt ${i})"
              exit 0
            fi
            sleep 2
          done
          echo "Package Manager failed to start within 120 seconds"
          docker logs packagemanager
          exit 1

      # Surface license errors as workflow annotations
      - name: Check for license errors
        if: failure() && steps.pm-license.outputs.available == 'true'
        run: |
          LOGS=$(docker logs packagemanager 2>&1 || true)
          LICENSE_MSG=$(echo "${LOGS}" | grep -i "license" | grep -iE "expired|invalid|unable|not activated" | head -1 || true)
          if [ -n "${LICENSE_MSG}" ]; then
            echo "::error title=License Error::${LICENSE_MSG}"
            {
              echo "## License Error"
              echo ""
              echo "The Package Manager license key is expired or invalid. Update the \`RSPM_LICENSE\` repository secret."
              echo ""
              echo '```'
              echo "${LICENSE_MSG}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Provision CRAN and PyPI repositories for smoke testing
      - name: Provision smoke test repositories
        if: steps.pm-license.outputs.available == 'true'
        run: |
          echo "Creating CRAN repository..."
          docker exec packagemanager /opt/rstudio-pm/bin/rspm create repo \
            --name=cran-all --type=r --description="CRAN mirror"
          docker exec packagemanager /opt/rstudio-pm/bin/rspm create source \
            --name=cran-mirror --type=cran-snapshot
          docker exec packagemanager /opt/rstudio-pm/bin/rspm subscribe \
            --repo=cran-all --source=cran-mirror

          echo "Creating PyPI repository..."
          docker exec packagemanager /opt/rstudio-pm/bin/rspm create repo \
            --name=pypi-all --type=python --description="PyPI mirror"

          echo "Repositories provisioned successfully"

      # Resolve the actual Package Manager version. Fail loudly rather than
      # falling back to a hardcoded string, matching the Connect and
      # Workbench resolve-version steps above: a silent fallback here would
      # have masked the stale-PM-version bug this step is fixing, and a
      # placeholder is no more meaningful than an explicit failure once the
      # bare `ubuntu2204` tag (which always resolves to the latest build,
      # per packagemanager-smoke.yml) is what was actually requested.
      - name: Resolve Package Manager version
        if: steps.pm-license.outputs.available == 'true'
        id: pm-version
        run: |
          RESPONSE=$(curl -sf http://localhost:4242/__api__/status)
          VERSION=$(echo "${RESPONSE}" | jq -r '.version // empty')
          if [ -z "${VERSION}" ]; then
            echo "ERROR: Could not resolve Package Manager version from /__api__/status"
            echo "Response body: ${RESPONSE}"
            exit 1
          fi
          echo "Resolved Package Manager version: ${VERSION}"
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Playwright browsers
        run: uv run vip install --skip-system

      # Generate vip.toml from with-connect and PM outputs
      - name: Configure VIP for CI
        run: |
          PM_SECTION=""
          if [ "${{ steps.pm-license.outputs.available }}" = "true" ]; then
            PM_SECTION="
          [package_manager]
          enabled = true
          url = \"${{ steps.pm.outputs.PM_URL }}\"
          version = \"${{ steps.pm-version.outputs.resolved }}\""
          fi

          WB_SECTION=""
          WB_AUTH=""
          if [ "${{ steps.wb-license.outputs.available }}" = "true" ]; then
            WB_SECTION="
          [workbench]
          enabled = true
          url = \"${{ steps.workbench.outputs.WORKBENCH_URL }}\"
          version = \"${{ steps.wb-version.outputs.resolved }}\""
            WB_AUTH="
          username = \"${{ steps.workbench.outputs.WORKBENCH_USER }}\"
          password = \"${{ steps.workbench.outputs.WORKBENCH_PASSWORD }}\""
          fi

          DEPLOYMENT_NAME="CI Connect ${{ steps.version.outputs.resolved }}"
          if [ "${{ steps.wb-license.outputs.available }}" = "true" ]; then
            DEPLOYMENT_NAME="${DEPLOYMENT_NAME} + WB ${{ steps.wb-version.outputs.resolved }}"
          fi
          if [ "${{ steps.pm-license.outputs.available }}" = "true" ]; then
            DEPLOYMENT_NAME="${DEPLOYMENT_NAME} + PM ${{ steps.pm-version.outputs.resolved }}"
          fi

          cat > vip.toml << EOF
          [general]
          deployment_name = "${DEPLOYMENT_NAME}"

          [connect]
          enabled = true
          url = "${{ steps.connect.outputs.CONNECT_SERVER }}"
          api_key = "${{ steps.connect.outputs.CONNECT_API_KEY }}"
          version = "${{ steps.version.outputs.resolved }}"
          ${PM_SECTION}
          ${WB_SECTION}
          [auth]
          provider = "password"
          ${WB_AUTH}
          EOF

      # `|| true` used to swallow pytest's exit code entirely, so a real crash
      # (bad collection, a plugin exception, wrong CLI usage) rendered a report
      # from a stale or missing results.json and still went green. Capture the
      # code instead: 0 (all passed) and 1 (some tests failed -- expected here,
      # since the demo scenario fails by design) both mean pytest ran to
      # completion and results.json is trustworthy, so let the job continue to
      # the render step. 2-5 (interrupted, internal error, usage error, no
      # tests collected) mean it didn't, so fail the job loudly instead.
      - name: Run smoke tests and generate results
        env:
          VIP_ENABLE_EXPECTED_FAILURE_DEMO: "1"
        run: |
          set +e
          uv run pytest \
            src/vip_tests/prerequisites/ \
            src/vip_tests/connect/test_auth.py \
            src/vip_tests/connect/test_users.py \
            src/vip_tests/connect/test_runtime_versions.py \
            src/vip_tests/connect/test_system_checks.py \
            src/vip_tests/security/test_error_handling.py \
            src/vip_tests/workbench/test_auth.py \
            src/vip_tests/package_manager/test_repos.py \
            -v \
            --vip-config=vip.toml
          PYTEST_EXIT_CODE=$?
          set -e
          echo "pytest exited with code ${PYTEST_EXIT_CODE}"
          if [ "${PYTEST_EXIT_CODE}" -eq 0 ] || [ "${PYTEST_EXIT_CODE}" -eq 1 ]; then
            exit 0
          fi
          echo "::error::pytest exited with code ${PYTEST_EXIT_CODE} (collection, usage, or internal error rather than a test failure); see the log above for details."
          exit 1

      - name: Render Quarto report
        run: cd report && uv run quarto render

      # Both renders write report/_output and both runs write
      # report/results.json, so the standard report has to move out of the way
      # before the compliance pass starts. Everything below runs before the
      # product containers stop, because the Part 11 scenarios need the same
      # live Connect.
      - name: Stage the standard report
        run: |
          mkdir -p _site
          mv report/_output _site/example-report

      # A Connect-only config on purpose. The Part 11 example also maps
      # Workbench and Package Manager controls, but this job stands up Connect
      # for the compliance pass, and reusing vip.toml would print the other two
      # into the products table of a report in which no scenario touched them.
      #
      # The published matrix therefore shows the four Workbench and Package
      # Manager controls as gaps. That is the intended demonstration: VIP
      # deselects an unconfigured product's scenarios rather than skipping
      # them, so they never reach results.json and their controls read as gaps
      # rather than as covered. The example README explains the same thing in
      # prose; here a reader sees it in the artifact.
      - name: Configure VIP for the compliance example
        run: |
          cat > vip-compliance.toml << EOF
          [general]
          deployment_name = "CI Connect ${{ steps.version.outputs.resolved }} (21 CFR Part 11 example extension)"

          [connect]
          enabled = true
          url = "${{ steps.connect.outputs.CONNECT_SERVER }}"
          api_key = "${{ steps.connect.outputs.CONNECT_API_KEY }}"
          version = "${{ steps.version.outputs.resolved }}"
          EOF

      # Same exit-code contract as the smoke run above: 0 and 1 mean pytest
      # ran to completion, anything else means it did not. Exit code 5 (no
      # tests collected) is the one that matters most here -- VIP deselects
      # @connect scenarios when Connect is not configured, so a broken
      # vip-compliance.toml would otherwise render an empty compliance report
      # and publish it. VIP_ENABLE_EXPECTED_FAILURE_DEMO is deliberately unset:
      # the by-design failing demo scenario reads as a broken deployment to the
      # audience this report is for.
      - name: Run the 21 CFR Part 11 example extension
        run: |
          set +e
          uv run pytest examples/21CFR_part11_validation/ -v --vip-config=vip-compliance.toml
          PYTEST_EXIT_CODE=$?
          set -e
          echo "pytest exited with code ${PYTEST_EXIT_CODE}"
          if [ "${PYTEST_EXIT_CODE}" -eq 0 ] || [ "${PYTEST_EXIT_CODE}" -eq 1 ]; then
            exit 0
          fi
          echo "::error::the Part 11 example extension exited with code ${PYTEST_EXIT_CODE} (collection, usage, or internal error rather than a test failure); see the log above for details."
          exit 1

      # VIP_CONTROLS must be absolute. Quarto renders with report/ as the
      # working directory, and both index.qmd and vip-report.qmd swallow every
      # exception by design, so a relative path would drop the traceability
      # section silently and the job would still go green.
      - name: Render the compliance report
        env:
          VIP_CONTROLS: ${{ github.workspace }}/examples/21CFR_part11_validation/controls.toml
        run: cd report && uv run quarto render

      - name: Stage the compliance report
        run: mv report/_output _site/example-compliance-report

      # Stop Connect
      - name: Stop Connect
        if: always()
        uses: posit-dev/with-connect@4f26a6a301716789d6451cc3afd878afdd52189b # main
        with:
          stop: ${{ steps.connect.outputs.CONTAINER_ID }}

      # Stop Package Manager
      - name: Stop Package Manager
        if: always() && steps.pm-license.outputs.available == 'true'
        run: docker stop packagemanager && docker rm packagemanager || true

      # Stop Workbench
      - name: Stop Workbench
        if: always() && steps.wb-license.outputs.available == 'true'
        uses: posit-dev/with-workbench@da367f7337b28c6748f7dd43d08706788353be8d # main
        with:
          stop: ${{ steps.workbench.outputs.CONTAINER_ID }}

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: example-report
          path: _site/example-report/

      - name: Upload compliance report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: example-compliance-report
          path: _site/example-compliance-report/
