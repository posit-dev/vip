name: Workbench Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/workbench-smoke.yml'
  pull_request:
  # Scheduled/manual runs fan the suite out across the Workbench support window
  # (see the set-matrix job). PR/push runs stay single-version.
  schedule:
    - cron: "30 4 * * *" # daily at 04:30 UTC (staggered from the other smoke workflows)
  workflow_dispatch:
    inputs:
      suite:
        description: 'gate = the PR-gated subset; full = every Workbench file (what the nightly runs)'
        type: choice
        default: gate
        options: [gate, full]

permissions:
  contents: read
  checks: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'src/vip_tests/workbench/**'
              - 'src/vip/clients/workbench.py'
              # shared across all smoke workflows:
              - 'src/vip_tests/prerequisites/**'
              # shared core — affects all products:
              - 'src/vip/auth.py'
              - 'src/vip/idp.py'
              - 'src/vip/config.py'
              - 'src/vip/plugin.py'
              - 'src/vip/cli.py'
              - 'src/vip/clients/base.py'
              - 'src/vip/timeouts.py'
              - 'src/vip_tests/conftest.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/workbench-smoke.yml'

  # Emit the Workbench version list for the product job. PR/push runs test only
  # the latest release (single required check, unchanged). Scheduled/manual runs
  # fan out across the support window (current + 2 back). Bump the pinned tags
  # here when a new Workbench release ships; `release` always tracks the newest
  # build. with-workbench maps <version> to the
  # rstudio/rstudio-workbench:jammy-<version> tag (see posit-dev/with-workbench
  # main.py get_docker_tag(); re-check on any with-workbench pin bump). Pinned
  # version strings must not be substrings of one another — the resolved-version
  # job-rename step below matches the running check by name substring.
  set-matrix:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'versions=["release", "2026.06.0", "2026.05.1"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["release"]' >> "$GITHUB_OUTPUT"
          fi

  workbench-smoke:
    needs: [changes, set-matrix]
    # Scheduled/manual runs always execute (no PR diff for paths-filter to
    # score); PR/push runs still gate on the changed-paths filter.
    if: >-
      needs.changes.outputs.relevant == 'true'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    name: Smoke test against Workbench ${{ matrix.workbench-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workbench-version: ${{ fromJSON(needs.set-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Start Workbench in Docker
      - name: Start Workbench
        id: workbench
        uses: posit-dev/with-workbench@da367f7337b28c6748f7dd43d08706788353be8d # main
        with:
          license-key: ${{ secrets.WORKBENCH_LICENSE }}
          version: ${{ matrix.workbench-version }}

      # Surface license errors as workflow annotations so expired keys
      # are immediately visible on the Actions run page.
      - name: Check for license errors
        if: failure() && steps.workbench.outcome == 'failure'
        run: |
          CID=$(docker ps -aq --filter "ancestor=rstudio/rstudio-workbench" | head -1)
          if [ -z "${CID}" ]; then
            echo "::error title=Workbench Startup Failed::Workbench container not found. The with-workbench action failed before creating a container."
            exit 1
          fi
          LOGS=$(docker logs "${CID}" 2>&1 || true)
          LICENSE_MSG=$(echo "${LOGS}" | grep -i "license" | grep -iE "expired|invalid|unable|not activated" | head -1 || true)
          if [ -n "${LICENSE_MSG}" ]; then
            echo "::error title=License Error::${LICENSE_MSG}"
            {
              echo "## License Error"
              echo ""
              echo "The Workbench license key is expired or invalid. Update the \`WORKBENCH_LICENSE\` repository secret."
              echo ""
              echo '```'
              echo "${LICENSE_MSG}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Workbench Startup Failed::Workbench failed to start. Check the 'Start Workbench' step logs for details."
          fi
          exit 1

      # Resolve the running Workbench version.
      # Primary: authenticated GET /api/server-info (sign in with -L to follow the
      #          302 redirect so all session cookies are captured).
      # Fallback: rstudio-server version command inside the container (queries the
      #           running binary directly; satisfies "verify the running instance").
      - name: Resolve Workbench version
        id: version
        run: |
          # Sign in - follow redirects (-L) so the session cookie jar is fully populated
          curl -s -L -c /tmp/wb_cookies.txt \
            -d "username=${{ steps.workbench.outputs.WORKBENCH_USER }}&password=${{ steps.workbench.outputs.WORKBENCH_PASSWORD }}" \
            ${{ steps.workbench.outputs.WORKBENCH_URL }}/auth-sign-in > /dev/null

          # Fetch server info with the authenticated session
          RESPONSE=$(curl -s -b /tmp/wb_cookies.txt ${{ steps.workbench.outputs.WORKBENCH_URL }}/api/server-info)
          VERSION=$(echo "${RESPONSE}" | jq -r '.version // empty' 2>/dev/null || true)

          # Fallback: query the running binary directly if the API didn't return JSON
          if [ -z "${VERSION}" ]; then
            echo "INFO: /api/server-info did not yield a version (response: ${RESPONSE:0:200})"
            echo "INFO: Falling back to rstudio-server version"
            VERSION=$(docker exec ${{ steps.workbench.outputs.CONTAINER_ID }} rstudio-server version 2>/dev/null \
                      | grep -oE '[0-9]{4}\.[0-9]+\.[0-9]+\+[^[:space:]]+' | head -1 || true)
          fi

          if [ -z "${VERSION}" ]; then
            echo "ERROR: Could not resolve version from the running Workbench instance"
            exit 1
          fi

          echo "Resolved Workbench version: ${VERSION}"
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"

      # Rename the check run so the job title shows the resolved version
      - name: Update job title with resolved version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const resolvedVersion = '${{ steps.version.outputs.resolved }}';
            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const currentJob = jobs.find(
              j => j.status === 'in_progress' && j.name.includes('${{ matrix.workbench-version }}')
            );
            if (currentJob) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: currentJob.id,
                name: `Smoke test against Workbench ${resolvedVersion}`,
              });
            }

      # Set up Python and install VIP
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: uv run vip install --skip-system

      # Generate vip.toml from with-workbench outputs
      # The password is deliberately NOT written here — it is passed to pytest as
      # VIP_TEST_PASSWORD, which config.py:354 reads as the fallback. Writing it
      # into the file would put a live credential on the runner disk and fail
      # config_hygiene/test_secrets.
      - name: Configure VIP for CI Workbench
        run: |
          # [runtimes] is derived from the container rather than pinned, which is
          # what workbench/test_runtime_versions needs to run at all -- it skips
          # outright on "No expected R versions specified in vip.toml [runtimes]"
          # (#550). /opt/R and /opt/python also hold non-version entries ("default"
          # symlink, "jupyter"), so keep only things that start like a version or
          # they get written as expected runtimes and the tests fail on them.
          # The || true groups are defensive, not load-bearing today: GitHub's
          # implicit shell is `bash -e {0}` with no pipefail, so grep's no-match
          # exit is already masked by jq's success. They keep the explicit
          # emptiness check below authoritative if this step ever gains an
          # explicit `shell: bash`, which does add -o pipefail.
          CID="${{ steps.workbench.outputs.CONTAINER_ID }}"
          list_versions() {
            { docker exec "$CID" ls -1 "$1" 2>/dev/null || true; } \
              | { grep -E '^[0-9]+\.[0-9]+' || true; } \
              | jq -R . | jq -sc .
          }
          R_VERSIONS=$(list_versions /opt/R)
          PY_VERSIONS=$(list_versions /opt/python)
          : "${R_VERSIONS:=[]}"
          : "${PY_VERSIONS:=[]}"
          echo "Detected R: ${R_VERSIONS}"
          echo "Detected Python: ${PY_VERSIONS}"
          # An empty list means the image layout changed and the runtime tests
          # would silently go back to skipping; fail loudly instead.
          if [ "${R_VERSIONS}" = "[]" ] || [ "${PY_VERSIONS}" = "[]" ]; then
            echo "::error::Could not enumerate runtimes under /opt/R or /opt/python; the image layout may have changed."
            exit 1
          fi

          cat > vip.toml << EOF
          [general]
          deployment_name = "CI Workbench"

          [connect]
          enabled = false

          [workbench]
          enabled = true
          url = "${{ steps.workbench.outputs.WORKBENCH_URL }}"
          version = "${{ steps.version.outputs.resolved }}"

          [runtimes]
          r_versions = ${R_VERSIONS}
          python_versions = ${PY_VERSIONS}

          [auth]
          provider = "password"
          username = "${{ steps.workbench.outputs.WORKBENCH_USER }}"
          EOF

          # workbench/test_packages checks that the R session's repositories
          # include the configured Package Manager URL. The image's repos.conf
          # already points sessions at public PPM:
          #   RSPM=https://packagemanager.posit.co/cran/__linux__/jammy/latest
          # so declaring that URL makes the assertion real with no PM container
          # (#551). Full tier only: declaring package_manager also pulls PPM into
          # the prerequisites and cross_product health checks, and the gate should
          # not depend on a service outside this repo's control.
          if [ "${SUITE}" = "full" ]; then
            cat >> vip.toml << EOF

          [package_manager]
          enabled = true
          url = "https://packagemanager.posit.co"
          EOF
          else
            cat >> vip.toml << EOF

          [package_manager]
          enabled = false
          EOF
          fi
          echo "--- generated vip.toml ---"; cat vip.toml
        env:
          SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'full' || 'gate') }}

      # Run the subset of tests that work against Docker Workbench
      - name: Run Workbench smoke tests
        # -n 0 disables xdist (overriding -n auto from pyproject.toml) because
        # the Docker Workbench returns "Temporary server error" when multiple
        # workers attempt concurrent logins.
        #
        # No `-k` filter: the plugin already deselects scenarios for products
        # that are not enabled in vip.toml, so the previous `-k "workbench"`
        # collected exactly the same tests while silently deselecting any
        # cross-cutting suite whose name lacks the word "workbench".
        #
        # `-rs` asks for skip reasons. Note they do not currently reach the log —
        # VIP's plugin owns the terminal reporter and suppresses the short
        # summary — so read skip reasons from the uploaded smoke-results.xml
        # (`<skipped message=...>`) instead.
        #
        # Two tiers, split on measured evidence from a suite=full run on three
        # Workbench versions (#539):
        #   gate — PR/push. Everything here either passes or skips for a reason
        #          that a Docker Workbench can never satisfy. 195s of test time.
        #   full — schedule/dispatch. Adds the 9 remaining Workbench files, worth
        #          8 more real passes but 523s more test time, so it is not worth
        #          a PR gate. test_ide_extensions was promoted to the gate out of
        #          this set: 3/3 pass for 83s.
        #
        # Excluded from both: test_session_capacity_k8s.py needs a real
        # Kubernetes launcher, which a container cannot provide.
        run: |
          files="
            src/vip_tests/prerequisites/test_components.py
            src/vip_tests/workbench/test_auth.py
            src/vip_tests/workbench/test_ide_launch.py
            src/vip_tests/workbench/test_ide_extensions.py
            src/vip_tests/workbench/test_data_sources.py
            src/vip_tests/security/test_auth_policy.py
            src/vip_tests/cross_product/test_resources.py
            src/vip_tests/config_hygiene/test_secrets.py
          "
          if [ "${SUITE}" = "full" ]; then
            echo "::notice::Running the full Workbench suite, not the PR gate set."
            # Measured outcomes against a bare container, per file:
            #   test_git_ops         3/6 — clones pass; pushes skip, the test repo
            #                        is anonymous read-only (git_test.auth_method=none)
            #   test_session_capacity 1/1
            #   test_jobs            1/2 — no Background Jobs tab in the container
            #   test_runtime_versions 1/1 — file now holds a single scenario,
            #                        the in-session R version check; needs
            #                        [runtimes] populated to run (#516)
            #   test_packages        moved here from the gate (#551): it needs the
            #                        [package_manager] URL, which is full-tier
            #                        only, and on the gate it spent 29s launching
            #                        a session then skipped at its @then
            #   test_session_idle    0/2 — needs idle_timeout_minutes, then waits it out
            #   test_chronicle       0/1 — needs [chronicle] enabled
            #   test_sessions        0/1 — container does not support suspend/resume
            #   test_publish_to_connect — deselected, Connect is disabled here
            files="${files}
              src/vip_tests/workbench/test_sessions.py
              src/vip_tests/workbench/test_session_idle.py
              src/vip_tests/workbench/test_session_capacity.py
              src/vip_tests/workbench/test_jobs.py
              src/vip_tests/workbench/test_git_ops.py
              src/vip_tests/workbench/test_packages.py
              src/vip_tests/workbench/test_runtime_versions.py
              src/vip_tests/workbench/test_chronicle.py
              src/vip_tests/workbench/test_publish_to_connect.py
            "
          fi
          # shellcheck disable=SC2086 # word splitting is how the file list is passed
          uv run pytest $files \
            -v -rs -n 0 \
            --vip-config=vip.toml \
            --junitxml=smoke-results.xml
        env:
          # PR/push get the gate set. The nightly schedule runs everything, so the
          # slow suites are still exercised daily without taxing the merge path.
          SUITE: ${{ inputs.suite || (github.event_name == 'schedule' && 'full' || 'gate') }}
          VIP_TEST_PASSWORD: ${{ steps.workbench.outputs.WORKBENCH_PASSWORD }}

      # Upload test results for debugging failures
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workbench-smoke-results-${{ matrix.workbench-version }}
          path: smoke-results.xml

      # Write a rich job summary with test details and emoji
      - name: Write workflow summary
        if: always()
        run: |
          RESOLVED="${{ steps.version.outputs.resolved }}"
          WB_URL="${{ steps.workbench.outputs.WORKBENCH_URL }}"
          REQUESTED="${{ matrix.workbench-version }}"
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo "## 🧪 Workbench Smoke Tests — v${RESOLVED}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 🏷️ **Requested version** | \`${REQUESTED}\` |"
            echo "| ✅ **Resolved version** | \`${RESOLVED}\` |"
            echo "| 🌐 **Workbench URL** | \`${WB_URL}\` |"
            echo "| 📅 **Run date** | ${RUN_DATE} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f smoke-results.xml ]; then
            TESTS=$(grep -oP '(?<=tests=")[^"]+' smoke-results.xml | head -1 || echo 0)
            FAILURES=$(grep -oP '(?<=failures=")[^"]+' smoke-results.xml | head -1 || echo 0)
            ERRORS=$(grep -oP '(?<=errors=")[^"]+' smoke-results.xml | head -1 || echo 0)
            SKIPPED=$(grep -oP '(?<=skipped=")[^"]+' smoke-results.xml | head -1 || echo 0)
            TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
            PASSED=$(( TESTS - FAILURES - ERRORS - SKIPPED ))
            {
              echo "### 📊 Test Results"
              echo ""
              echo "| Result | Count |"
              echo "|--------|-------|"
              echo "| ✅ Passed | ${PASSED} |"
              echo "| ❌ Failed | ${FAILURES:-0} |"
              echo "| ⚠️ Errors | ${ERRORS:-0} |"
              echo "| ⏭️ Skipped | ${SKIPPED:-0} |"
              echo "| 📝 **Total** | **${TESTS:-0}** |"
              echo ""
              if [ "${FAILURES:-0}" = "0" ] && [ "${ERRORS:-0}" = "0" ]; then
                echo "🎉 **All tests passed!**"
              else
                echo "💥 **Some tests failed — check the logs for details.**"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ⚠️ Test results file not found — tests may have been skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Stop and remove the Workbench container
      - name: Stop Workbench
        if: always()
        uses: posit-dev/with-workbench@da367f7337b28c6748f7dd43d08706788353be8d # main
        with:
          stop: ${{ steps.workbench.outputs.CONTAINER_ID }}

  status:
    name: Workbench Smoke Tests Status
    if: always()
    needs: [changes, set-matrix, workbench-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke test result
        run: |
          if [ "${{ needs.changes.result }}" = "failure" ] || [ "${{ needs.changes.result }}" = "cancelled" ]; then
            echo "Change-detection job failed; cannot confirm smoke scope"
            exit 1
          fi
          # A failed set-matrix skips (not fails) workbench-smoke, which would
          # otherwise look identical to a clean no-relevant-paths skip below.
          if [ "${{ needs.set-matrix.result }}" = "failure" ] || [ "${{ needs.set-matrix.result }}" = "cancelled" ]; then
            echo "Version-matrix job failed; cannot confirm smoke scope"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.relevant }}" = "true" ] && [ "${{ needs.workbench-smoke.result }}" != "success" ]; then
            echo "Workbench smoke was in scope for this PR but did not succeed (result=${{ needs.workbench-smoke.result }})"
            exit 1
          fi
          if [ "${{ needs.workbench-smoke.result }}" = "failure" ] || [ "${{ needs.workbench-smoke.result }}" = "cancelled" ]; then
            echo "Workbench smoke tests failed or were cancelled"
            exit 1
          fi
          echo "Workbench smoke tests passed or were legitimately out of scope"
