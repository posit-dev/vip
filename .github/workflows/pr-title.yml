# PR Title Convention Check
#
# Ensures PR titles follow conventional commit format so that
# squash merges produce commits that semantic-release can analyze.
#
# Valid formats:
#   feat: add new feature
#   fix(scope): fix bug in scope
#   docs: update documentation
#   chore!: breaking change

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Pushes to a PR branch cancel that PR's older run. Every other event keys on
# its own run id, so runs on main, schedules and tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The subject (after the type) cannot be empty.
            Example: "feat: add user authentication"
