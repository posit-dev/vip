name: Set up VIP
description: >-
  Installs uv, syncs the locked dependencies and installs the Playwright browsers VIP's UI tests
  drive, with the browser download cached per Playwright version. Needs a checkout of the
  repository first. The browsers are installed with `vip install --skip-system` because the
  runner already carries the system libraries.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --frozen

    # The UI smoke tests drive a real browser, so the Playwright browsers must be installed.
    # The API-only tests don't need them; the browser cache keeps this cheap on repeat runs.
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      shell: bash
      run: uv run vip install --skip-system
