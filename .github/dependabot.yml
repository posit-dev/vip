updates:
- commit-message:
    prefix: chore(deps)
  cooldown:
    default-days: 7
  directory: /
  groups:
    python-dependencies:
      patterns:
      - "*"
  # VIP's plugin reads pytest-bdd internals (vip.plugin.results._scenario_for and _scenario_given_steps);
  # major bumps need a deliberate migration, not a grouped weekly update.
  ignore:
  - dependency-name: pytest-bdd
    update-types:
    - version-update:semver-major
  # pytest 9.2 stores node ids where pytest-xdist 3.8.0 does not write the loadgroup suffix, so
  # --dist loadgroup silently ignores every group (pytest-dev/pytest-xdist#1407). Drop this once a
  # pytest-xdist release after 3.8.0 is pinned; TestXdistSeesVipGroups fails if it comes off early.
  - dependency-name: pytest
    versions:
    - ">=9.2"
  package-ecosystem: uv
  schedule:
    interval: weekly
- commit-message:
    prefix: chore(deps)
  cooldown:
    default-days: 7
  directory: /
  groups:
    actions-dependencies:
      patterns:
      - "*"
  package-ecosystem: github-actions
  schedule:
    interval: weekly
version: 2
