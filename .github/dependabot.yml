updates:
- commit-message:
    prefix: chore(deps)
  cooldown:
    default-days: 7
  directory: /
  groups:
    python-dependencies:
      patterns:
      - "*"
  # pytest-bdd 9 removed the __scenario__ attribute VIP's plugin reads; major
  # bumps need a deliberate migration, not a grouped weekly update.
  ignore:
  - dependency-name: pytest-bdd
    update-types:
    - version-update:semver-major
  package-ecosystem: uv
  schedule:
    interval: weekly
- commit-message:
    prefix: chore(deps)
  cooldown:
    default-days: 7
  directory: /
  groups:
    actions-dependencies:
      patterns:
      - "*"
  package-ecosystem: github-actions
  schedule:
    interval: weekly
version: 2
